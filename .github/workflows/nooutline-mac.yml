name: nooutline-mac
# Test-only: 64-byte alignment of the decompression fastloops on arm64, on top
# of PR 487 (-mno-outline on Apple).  HEAD~3 = upstream master, HEAD~2 = PR
# 487, HEAD~1 = the alignment, HEAD = this test-only commit.  Not for upstream.
#   mac:   master vs PR+alignment (test) and vs PR alone (extra), CMake
#          Release dylibs, each library timed alone in its own process per
#          file, with a copy of master as an A/A control (scripts/nooutline_ci)
#   linux: arm64 Linux, gcc and clang: PR (= master there, the CMake change is
#          Apple-only) vs PR+alignment, plus a -Werror build and ctest
on:
  push:
    branches: ['nooutline-mac*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nooutline-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Inputs
      run: bash scripts/nooutline_ci/inputs.sh "$RUNNER_TEMP/in"
    - uses: actions/upload-artifact@v7
      with:
        name: inputs
        path: ${{ runner.temp }}/in
        retention-days: 3
        compression-level: 1

  mac:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
        - { image: xcode-27, xcode: /Applications/Xcode_27.2.app, shard: 1 }
        - { image: xcode-27, xcode: /Applications/Xcode_27.2.app, shard: 2 }
        - { image: macos-26, xcode: /Applications/Xcode_26.6.app, shard: 1 }
    name: ${{ matrix.image }} ${{ matrix.shard }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 5
    - uses: actions/download-artifact@v8
      with:
        name: inputs
        path: ${{ runner.temp }}/in
    - name: Time
      env:
        IMAGE: ${{ matrix.image }}
        XCODE: ${{ matrix.xcode }}
        AB_BASE: HEAD~3
        AB_TEST: HEAD~1
        AB_EXTRA: HEAD~2
        AB_COMP_LEVELS: 1 4 5 6 7 8 9 10 12
        AB_DECOMP_LEVELS: 1 6
        AB_ALIGNED: '0'
      run: bash scripts/nooutline_ci/time.sh "$RUNNER_TEMP/in" "$RUNNER_TEMP/res"
    - name: Summary
      if: always()
      run: |
        {
          echo '```'
          cat "$RUNNER_TEMP/res/meta.txt" 2>/dev/null || echo "no timing results"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: time-${{ matrix.image }}-${{ matrix.shard }}
        path: |
          ${{ runner.temp }}/res/meta.txt
          ${{ runner.temp }}/res/res.txt
        if-no-files-found: warn

  linux:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: linux-arm64-${{ matrix.cc }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 5
    - uses: actions/download-artifact@v8
      with:
        name: inputs
        path: ${{ runner.temp }}/in
    - name: Build with -Werror and assertions, run the tests
      run: |
        mkdir -p "$RUNNER_TEMP/src"
        git archive HEAD~1 | tar -x -C "$RUNNER_TEMP/src"
        CFLAGS="-Werror -DLIBDEFLATE_ENABLE_ASSERTIONS" cmake -S "$RUNNER_TEMP/src" -B "$RUNNER_TEMP/bt" -DLIBDEFLATE_BUILD_TESTS=1
        cmake --build "$RUNNER_TEMP/bt" -j"$(nproc)"
        ctest --test-dir "$RUNNER_TEMP/bt"
        $CC --version | head -1
        nm "$RUNNER_TEMP/bt/libdeflate.so" | grep decompress_fastloop
    - name: Time
      env:
        IMAGE: linux-arm64-${{ matrix.cc }}
        AB_BASE: HEAD~2
        AB_TEST: HEAD~1
        AB_COMP_LEVELS: 1 6 12
        AB_DECOMP_LEVELS: 1 6
        AB_ALIGNED: '0'
      run: bash scripts/nooutline_ci/time.sh "$RUNNER_TEMP/in" "$RUNNER_TEMP/res"
    - name: Summary
      if: always()
      run: |
        {
          echo '```'
          cat "$RUNNER_TEMP/res/meta.txt" 2>/dev/null || echo "no timing results"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: time-linux-arm64-${{ matrix.cc }}
        path: |
          ${{ runner.temp }}/res/meta.txt
          ${{ runner.temp }}/res/res.txt
        if-no-files-found: warn

  report:
    needs: [mac, linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/all
    - name: Report
      run: |
        python3 scripts/nooutline_ci/summarize.py "$RUNNER_TEMP/all" | tee report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: report
        path: report.md
