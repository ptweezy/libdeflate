name: bench-round2
# Test-only workflow for benchmarking the round-2 commits; not for upstream.
on:
  push:
    branches: [round2-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 10
    - name: Benchmark
      run: |
        set -o pipefail
        bash scripts/bench_round2/run.sh 2>&1 | grep -v "round .* done" | tee bench.txt
    - uses: actions/upload-artifact@v4
      with:
        name: bench-${{ matrix.os }}
        path: bench.txt
