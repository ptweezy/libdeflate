name: mlsd-ci
# Test only: time master, the lanes at b2f1b4e and this tree's on the runners'
# CPUs at 4 code placements (scripts/mlsd_ci/run_ab.sh); clang 18 binaries
# are built once on Ubuntu 24.04 and also run on Ubuntu 22.04.  Not for
# upstream.
on:
  push:
    branches: ['mlsd-ci*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlsd-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Inputs
      run: bash scripts/mlsd_ci/inputs.sh "$RUNNER_TEMP/abin"
    - uses: actions/upload-artifact@v7
      with:
        name: ab-inputs
        path: ${{ runner.temp }}/abin
        retention-days: 3
        compression-level: 1
  build18:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Build (clang 18, static)
      env:
        CC: clang
      run: bash scripts/mlsd_ci/run_ab.sh -build "$RUNNER_TEMP/bin18"
    - uses: actions/upload-artifact@v7
      with:
        name: bin-c18
        path: ${{ runner.temp }}/bin18
        retention-days: 3
  bench:
    needs: [inputs, build18]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { name: p18-22-1, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-22-2, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-22-3, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-22-4, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-22-5, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-22-6, runner: ubuntu-22.04, pre: bin-c18 }
        - { name: p18-24-1, runner: ubuntu-24.04, pre: bin-c18 }
        - { name: p18-24-2, runner: ubuntu-24.04, pre: bin-c18 }
        - { name: c14-1, runner: ubuntu-22.04, cc: clang }
        - { name: c14-2, runner: ubuntu-22.04, cc: clang }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: ab-inputs
        path: ${{ runner.temp }}/abin
    - uses: actions/download-artifact@v8
      if: matrix.pre != ''
      with:
        name: ${{ matrix.pre }}
        path: ${{ runner.temp }}/pre
    - name: Benchmark (Silesia + enwik8)
      env:
        CC: ${{ matrix.cc || 'cc' }}
      run: bash scripts/mlsd_ci/run_ab.sh "$RUNNER_TEMP/abin" "$RUNNER_TEMP/bench" ${{ matrix.pre != '' && '"$RUNNER_TEMP/pre"' || '' }}
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bench-${{ matrix.name }}
        path: ${{ runner.temp }}/bench/res
        if-no-files-found: warn
