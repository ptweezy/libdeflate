name: mlsd-ci
# Test only: time master, the lanes at b2f1b4e and this tree's on the runners'
# CPUs (scripts/mlsd_ci/run_ab.sh).  Not for upstream.
on:
  push:
    branches: ['mlsd-ci*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlsd-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Inputs
      run: bash scripts/mlsd_ci/inputs.sh "$RUNNER_TEMP/abin"
    - uses: actions/upload-artifact@v7
      with:
        name: ab-inputs
        path: ${{ runner.temp }}/abin
        retention-days: 3
        compression-level: 1
  bench:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
        - { name: c18-1, runner: ubuntu-24.04, cc: clang }
        - { name: c18-2, runner: ubuntu-24.04, cc: clang }
        - { name: c18-3, runner: ubuntu-24.04, cc: clang }
        - { name: c18-4, runner: ubuntu-24.04, cc: clang }
        - { name: c18-5, runner: ubuntu-24.04, cc: clang }
        - { name: c18-6, runner: ubuntu-24.04, cc: clang }
        - { name: g13-1, runner: ubuntu-24.04, cc: gcc }
        - { name: g13-2, runner: ubuntu-24.04, cc: gcc }
        - { name: c14-1, runner: ubuntu-22.04, cc: clang }
        - { name: c14-2, runner: ubuntu-22.04, cc: clang }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: ab-inputs
        path: ${{ runner.temp }}/abin
    - name: Benchmark (Silesia + enwik8)
      env:
        CC: ${{ matrix.cc }}
      run: bash scripts/mlsd_ci/run_ab.sh "$RUNNER_TEMP/abin" "$RUNNER_TEMP/bench"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bench-${{ matrix.name }}
        path: ${{ runner.temp }}/bench/res
        if-no-files-found: warn
