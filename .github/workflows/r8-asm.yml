name: r8-asm
# Test-only: disassembly of the trees below HEAD with the runner's compilers.
on:
  push:
    branches: ['r8-asm*']
permissions:
  contents: read
jobs:
  asm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 12
    - name: Compile and disassemble
      run: |
        bash scripts/r8_asm/run.sh "$RUNNER_TEMP/asm" m0=aa5181e f2=03071b7 f3=6a20fde f4=0b38821 f5=050065a
    - uses: actions/upload-artifact@v7
      with:
        name: r8-asm
        path: ${{ runner.temp }}/asm
        retention-days: 7
