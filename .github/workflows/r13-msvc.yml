name: r13-msvc
# Test-only: interleaved MSVC timing of fixed commits on hosted Windows
# runners (scripts/r8_time/msab.py).  Not for upstream.
on:
  push:
    branches: ['r13-msvc*']
permissions:
  contents: read
concurrency:
  group: r13-msvc-${{ github.ref }}
  cancel-in-progress: true
env:
  # name ref pairs.  The library is built with CMake (Release), as a user
  # builds it, and msbench is linked against the static library.  nb is
  # b681754, nc1 is a72116f, nc2 and nc2b are f1ad6d3 (A/A control).
  REFS: nb b681754 nc1 a72116f nc2 f1ad6d3 nc2b f1ad6d3
  NAMES: nb,nc1,nc2,nc2b
  EXPECT: nb:x,nc1:x,nc2:x,nc2b:x
  PAIRS: nc2:nc2b,nb:nc1,nc1:nc2,nb:nc2
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Inputs
      run: bash scripts/r8_time/inputs.sh "$RUNNER_TEMP/r8in"
    - uses: actions/upload-artifact@v7
      with:
        name: r13-inputs
        path: ${{ runner.temp }}/r8in
        retention-days: 3
        compression-level: 1
  time:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        set: [syn]
        shard: [1, 2, 3, 4]
        runner: [windows-11-arm]
    name: ${{ matrix.arch }}-${{ matrix.set }}-${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 24
    - uses: actions/download-artifact@v8
      with:
        name: r13-inputs
        path: ${{ runner.temp }}/r8in
    - name: Build
      shell: cmd
      run: call scripts\r8_time\msbuildcm.bat ${{ matrix.arch }} "%RUNNER_TEMP%\msb" %REFS%
    - name: Time
      shell: bash
      env:
        MSB_CPU: 2
        SET: ${{ matrix.set }}
      run: |
        IN=$(cygpath -m "$RUNNER_TEMP/r8in")
        BIN=$(cygpath -m "$RUNNER_TEMP/msb")
        mkdir -p res
        powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors" | tr '\r\n' '  ' > res/cpu.txt
        cat res/cpu.txt; echo
        python scripts/r8_time/mslayout.py "$BIN" "$EXPECT" | tee res/layout.txt
        test "${PIPESTATUS[0]}" = 0
        cp "$BIN"/*.map "$BIN"/*.buildlog res/
        if [ "${{ matrix.shard }}" = 1 ]; then cp "$BIN"/*.dis res/; fi
        if [ "$SET" = real ]; then
          FILES="$IN/real/*"
          CFGS=12:0,10:0
        else
          FILES="$IN/syn/* $IN/adv/avoid241 $IN/adv/s5mix $IN/adv/rev140 $IN/adv/thr1k $IN/adv/thr4k $IN/adv/thr64k"
          CFGS=12:0,10:0,12:4096,12:16384,10:16384
        fi
        python scripts/r8_time/msab.py "$BIN" 16 3 res/res.tsv "$NAMES" "$CFGS" -- $FILES
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: r13-msvc-${{ matrix.arch }}-${{ matrix.set }}-${{ matrix.shard }}
        path: res
        if-no-files-found: warn
  aggregate:
    needs: time
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: r13-msvc-*
        path: res
    - name: Aggregate
      run: |
        python3 scripts/r8_time/msagg.py res "$PAIRS" | tee summary.md
        cat summary.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: r13-msvc-summary
        path: summary.md
