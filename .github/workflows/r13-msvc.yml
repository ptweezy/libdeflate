name: r13-msvc
# Test-only: interleaved MSVC timing of fixed commits on hosted Windows
# runners (scripts/r8_time/msab.py).  Not for upstream.
on:
  push:
    branches: ['r13-msvc*']
permissions:
  contents: read
concurrency:
  group: r13-msvc-${{ github.ref }}
  cancel-in-progress: true
env:
  # name ref pad triples (layout experiment): bN is 64c49ac and cN is 2bfa239,
  # each with N bytes of unused code after deflate_find_min_cost_path.  c0
  # already has every later function 16 bytes above b0, so b16/c0, b32/c16
  # and b48/c32 are pairs with the same layout.
  REFS: b0 64c49ac 0 b16 64c49ac 16 b32 64c49ac 32 b48 64c49ac 48 c0 2bfa239 0 c16 2bfa239 16 c32 2bfa239 32 c48 2bfa239 48
  NAMES: b0,b16,b32,b48,c0,c16,c32,c48
  EXPECT: b0:0,b16:16,b32:32,b48:48,c0:16,c16:32,c32:48,c48:64
  PAIRS: b0:c0,b0:b16,b0:b32,b0:b48,c0:c16,c0:c32,c0:c48,b16:c0,b32:c16,b48:c32,b0:c48
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Inputs
      run: bash scripts/r8_time/inputs.sh "$RUNNER_TEMP/r8in"
    - uses: actions/upload-artifact@v7
      with:
        name: r13-inputs
        path: ${{ runner.temp }}/r8in
        retention-days: 3
        compression-level: 1
  time:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        set: [real]
        shard: [1, 2, 3, 4]
        runner: [windows-11-arm]
    name: ${{ matrix.arch }}-${{ matrix.set }}-${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 12
    - uses: actions/download-artifact@v8
      with:
        name: r13-inputs
        path: ${{ runner.temp }}/r8in
    - name: Build
      shell: cmd
      run: call scripts\r8_time\msbuild.bat ${{ matrix.arch }} "%RUNNER_TEMP%\msb" %REFS%
    - name: Time
      shell: bash
      env:
        MSB_CPU: 2
        SET: ${{ matrix.set }}
      run: |
        IN=$(cygpath -m "$RUNNER_TEMP/r8in")
        BIN=$(cygpath -m "$RUNNER_TEMP/msb")
        mkdir -p res
        powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors" | tr '\r\n' '  ' > res/cpu.txt
        cat res/cpu.txt; echo
        python scripts/r8_time/mslayout.py "$BIN" "$EXPECT" | tee res/layout.txt
        test "${PIPESTATUS[0]}" = 0
        cp "$BIN"/*.map res/
        if [ "${{ matrix.shard }}" = 1 ]; then cp "$BIN"/*.dis res/; fi
        if [ "$SET" = real ]; then
          FILES="$IN/real/*"
          CFGS=12:0,10:0
        else
          FILES="$IN/syn/* $IN/adv/avoid241 $IN/adv/s5mix $IN/adv/rev140 $IN/adv/thr1k $IN/adv/thr4k $IN/adv/thr64k"
          CFGS=12:0,10:0,12:4096,12:16384,10:16384
        fi
        python scripts/r8_time/msab.py "$BIN" 16 3 res/res.tsv "$NAMES" "$CFGS" -- $FILES
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: r13-msvc-${{ matrix.arch }}-${{ matrix.set }}-${{ matrix.shard }}
        path: res
        if-no-files-found: warn
  aggregate:
    needs: time
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: r13-msvc-*
        path: res
    - name: Aggregate
      run: |
        python3 scripts/r8_time/msagg.py res "$PAIRS" | tee summary.md
        cat summary.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: r13-msvc-summary
        path: summary.md
